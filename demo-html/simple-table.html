<!doctype html>
<html lang="en">
	<head>
		<title>Basic HTML Table</title>
		<style>
			table,
			th,
			td {
				border: 1px solid black;
				border-collapse: collapse;
			}

			th,
			td {
				padding: 5px;
				text-align: left;
			}
		</style>
	</head>
	<body>
		<h2>Basic HTML Table</h2>

		<table style="width: 50%">
			<thead>
				<tr>
					<th>First name</th>
					<th>Last name</th>
					<th>Date of birth</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>John</td>
					<td>Doe</td>
					<td>01-01-1990</td>
				</tr>
				<tr>
					<td>Logan</td>
					<td>Deacon</td>
					<td>01-01-2000</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
